<style>
.ml{stroke-dasharray:1;animation:mline 6s linear infinite}
@keyframes mline{0%{stroke-dashoffset:1}30%{stroke-dashoffset:0}70%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:-1}}
.mh{animation:mhead 6s linear infinite}
@keyframes mhead{0%,27%{opacity:0}32%{opacity:1}68%{opacity:1}74%,100%{opacity:0}}
.mb{transform-box:fill-box;transform-origin:50% 100%;animation:mbar 6s ease-in-out infinite backwards}
@keyframes mbar{0%{transform:scaleY(0)}12%{transform:scaleY(1)}62%{transform:scaleY(1)}74%,100%{transform:scaleY(0)}}
.md{transform-box:fill-box;transform-origin:50% 50%;animation:mdot 6s ease-in-out infinite backwards}
@keyframes mdot{0%{transform:scale(0);opacity:0}7%{transform:scale(1.5);opacity:1}12%{transform:scale(1);opacity:1}62%{transform:scale(1);opacity:1}72%,100%{transform:scale(0);opacity:0}}
.mf{animation:mfill 6s ease-in-out infinite}
@keyframes mfill{0%,22%{opacity:0}40%{opacity:1}68%{opacity:1}82%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ml,.mh,.mb,.md,.mf{animation:none}}
</style>
